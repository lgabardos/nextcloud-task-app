# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [master]

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nécessaire pour créer tags et releases

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # nécessaire pour que git tag fonctionne correctement

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version détectée : v${VERSION}"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Le tag ${{ steps.version.outputs.tag }} existe déjà, rien à faire."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release as draft (manually pass it to published)
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true  # génère automatiquement les notes depuis les commits/PRs
          draft: true
          prerelease: false